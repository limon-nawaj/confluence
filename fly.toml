app = "unidocs-app"
primary_region = "ord"       # Chicago — closest to ISU

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true   # free tier: stop when idle
  auto_start_machines = true
  min_machines_running = 0    # scale to zero to stay free

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
